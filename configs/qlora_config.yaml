# ============================================================
# QLoRA / PEFT Training Configuration
# Enterprise Domain LLM — Assignment 1B
# ============================================================

# NOTE: 4-bit quantization (NF4) is NOT supported on Apple M4 MPS.
# bitsandbytes is installed but 4-bit ops require CUDA.
# On macOS: src/training/qlora_trainer.py runs native bfloat16 LoRA on MPS.
# On CUDA (Google Colab T4): true 4-bit NF4 QLoRA is enabled automatically.

lora:
  r: 16                        # LoRA rank (Adapter B)
  lora_alpha: 32               # Scaling factor (alpha/r = 2.0)
  target_modules:
    - "q_proj"
    - "v_proj"
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

quantization:
  # Auto-enabled on CUDA; unsupported on Apple MPS
  use_4bit: true               # Effective on CUDA only (see qlora_trainer.py)
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true

training:
  output_dir: "models/lora_adapter"
  num_train_epochs: 2
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  warmup_steps: 5
  lr_scheduler_type: "cosine"
  weight_decay: 0.01
  bf16: true                   # Native BF16 on MPS / Ampere+; FP16 on T4 CUDA
  logging_steps: 5
  eval_strategy: "epoch"
  save_strategy: "epoch"
  save_total_limit: 1
  report_to: "none"
  dataloader_num_workers: 0    # 0 for macOS MPS stability

sft:
  max_length: 384
  packing: false
  dataset_text_field: "text"
